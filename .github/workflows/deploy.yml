name: Build & Deploy to VPS (hariyuka.my.id)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/hariyuka-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/hariyuka-frontend

jobs:
  # ─── STAGE 1: Build Docker Images on GitHub Runner (Anti-OOM for VPS) ───
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository owner to lowercase for Docker image naming standard
      - name: Lowercase Repository Owner
        id: prep
        run: |
          echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Build & Push FastAPI Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/hariyuka-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Next.js Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/hariyuka-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://hariyuka.my.id/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── STAGE 2: Deploy to VPS via SSH ───
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 [Hariyuka AI] Starting Zero-Downtime Deployment on VPS..."
            
            # Navigate to project directory (default: ~/HariyukaAI or /home/ubuntu/HariyukaAI)
            cd /root/HariyukaAI || cd /home/$USER/HariyukaAI || cd ~/HariyukaAI
            
            # Pull latest git config
            git pull origin main
            
            # Pull latest prebuilt images from GHCR
            docker compose pull
            
            # Restart containers connected to web_proxy network
            docker compose up -d --remove-orphans
            
            # Clean up old unused images to save disk space
            docker image prune -af --filter "until=24h"
            
            echo "✅ [Hariyuka AI] Successfully Deployed to https://hariyuka.my.id!"
