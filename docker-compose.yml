version: '3.8'

services:
  # ─── FASTAPI BACKEND (Python 3.11 - Single Worker) ───
  hariyuka_backend:
    image: ghcr.io/keefalegends/hariyuka-backend:latest
    container_name: hariyuka_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    networks:
      - web_proxy
    deploy:
      resources:
        limits:
          memory: 180M

  # ─── NEXT.JS 14 FRONTEND (Standalone Multi-stage) ───
  hariyuka_frontend:
    image: ghcr.io/keefalegends/hariyuka-frontend:latest
    container_name: hariyuka_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://hariyuka.my.id/api/v1
    networks:
      - web_proxy
    depends_on:
      - hariyuka_backend
    deploy:
      resources:
        limits:
          memory: 180M

networks:
  web_proxy:
    external: true
