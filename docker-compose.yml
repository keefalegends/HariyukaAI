version: '3.8'

services:
  # Redis for Background Job Queue & SSE Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: hariyuka-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # FastAPI Engine Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hariyuka-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  # Next.js 14 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hariyuka-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  redis_data:
